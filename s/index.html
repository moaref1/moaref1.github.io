<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Listen in mewsic</title><style>body{margin:0;background:#0b090c;color:#f5f1f4;font:16px system-ui;display:grid;place-items:center;min-height:100dvh}main{max-width:420px;padding:32px;text-align:center}h1{font-size:32px;overflow-wrap:anywhere}p{color:#b6adb4}a{display:block;padding:16px 24px;background:#b92345;border-radius:18px;color:white;text-decoration:none;margin:24px 0}small{color:#b6adb4}</style><main><p>mewsic</p><h1 id="title">A song for you</h1><p id="artist"></p><a id="open" hidden>Play in mewsic</a><small id="note">Requires mewsic installed on Android.</small></main><script>try{const code=location.hash.slice(1);if(code.length>4096)throw Error();let raw=code.replace(/-/g,'+').replace(/_/g,'/');raw+='='.repeat((4-raw.length%4)%4);const parts=new TextDecoder().decode(Uint8Array.from(atob(raw),c=>c.charCodeAt(0))).split('\u0000');if(parts.length!==2||!parts[0]||parts[0].length>400||parts[1].length>200)throw Error();const [t,a]=parts;document.getElementById('title').textContent=t;document.getElementById('artist').textContent=a;const params=new URLSearchParams({title:t,artist:a,play:'1'});const open=document.getElementById('open');open.href=/Android/i.test(navigator.userAgent)?'intent://search?'+params+'#Intent;scheme=mewsic;package=app.mewsic.nativeapp;end':'mewsic://search?'+params;open.hidden=false}catch(e){document.getElementById('note').textContent='Invalid song link'}</script></html>
